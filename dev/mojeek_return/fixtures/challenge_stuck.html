<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Captcha</title></head>
<body>
<div id="page">
  <h1>Verification required</h1>
  <form id="altcha-form" method="post" action="/captcha/verify">
    <altcha-widget id="altcha-widget" challenge="/captcha/challenge" name="altcha" theme="default"></altcha-widget>
    <div id="captcha-note" class="captcha-note">Waiting for verification.</div>
  </form>
</div>
<script>
function buildPayload(timeMs) {
  return btoa(JSON.stringify({
    challenge: {parameters: {algorithm: 'PBKDF2/SHA-256', cost: 8000}},
    solution: {counter: 223, derivedKey: 'fixturederivedkey', time: timeMs}
  }));
}

class FixtureAltchaWidget extends HTMLElement {
  constructor() {
    super();
    this._state = 'unverified';
  }
  connectedCallback() {
    this.innerHTML = '<div class="altcha" data-state="unverified"><input type="checkbox"><input type="hidden" name="altcha"></div>';
    setTimeout(() => { this.dispatchEvent(new CustomEvent('load')); }, 10);
  }
  getState() { return this._state; }
  _setState(state, payload) {
    this._state = state;
    this.dispatchEvent(new CustomEvent('statechange', {detail: {state: state, payload: payload || null}}));
  }
  verify() {
    this._setState('verifying', null);
    setTimeout(() => {
      const payload = buildPayload(424.0);
      this._setState('verified', payload);
      this.dispatchEvent(new CustomEvent('verified', {detail: {payload: payload}}));
      document.getElementById('captcha-note').textContent = 'Checking verification with server...';
    }, 200);
  }
}
customElements.define('altcha-widget', FixtureAltchaWidget);
</script>
</body>
</html>
